<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PDF Library</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">



</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="group" onclick="toggleGroup('g2')">📚 My books
        <div class="group" onclick="toggleGroup('g21')">📚 Books 1</div>
        </div>
        <div class="pdf-list" id="g21">
            <div class="pdf-item" onclick="openPDF(this,'book1.pdf')">📄 ज़रूरत से ज़्यादा सोचना खुशी छीन लेता है</div>
            <div class="pdf-item" onclick="openPDF(this,'book2.pdf')">📄 आत्मा और शरीर का परिचय</div>
            <div class="pdf-item" onclick="openPDF(this,'book3.pdf')">📄 आत्मा की नवरात्रि</div>
            <div class="pdf-item" onclick="openPDF(this,'book4.pdf')">📄 खोज की शुरुआत</div>
            <div class="pdf-item" onclick="openPDF(this,'book5.pdf')">📄 चार लोग</div>
            <div class="pdf-item" onclick="openPDF(this,'book6.pdf')">📄 जीवन का रहस्य भीतर की आँख से</div>
            <div class="pdf-item" onclick="openPDF(this,'book7.pdf')">📄 जीवन को ज़बरदस्ती मत जियो</div>
            <div class="pdf-item" onclick="openPDF(this,'book8.pdf')">📄 भलाई और बुराई</div>
            <div class="pdf-item" onclick="openPDF(this,'book9.pdf')">📄 मन का दर्पण</div>
            <div class="pdf-item" onclick="openPDF(this,'book10.pdf')">📄 मनुष्य और प्रश्न</div>
            <div class="pdf-item" onclick="openPDF(this,'book11.pdf')">📄 सच को शपथ क्यों</div>
            <div class="pdf-item" onclick="openPDF(this,'book12.pdf')">📄 समाधि</div>
            
        </div>

    </div>

    <!-- Viewer -->
    <div class="viewer">

        <div class="topbar">
            <span id="fileName">Select PDF</span>
            <button onclick="downloadPDF()">Download</button>
        </div>

        <iframe id="pdfViewer"></iframe>

    </div>

    <script src="main.js"></script>
</body>

</html>
